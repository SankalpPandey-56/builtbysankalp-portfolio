<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #07080c;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        position: relative;
      }
      /* subtle grid backdrop */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse 85% 75% at 50% 35%, black 30%, transparent 100%);
        -webkit-mask-image: radial-gradient(ellipse 85% 75% at 50% 35%, black 30%, transparent 100%);
      }
      /* glowing orbs */
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
      }
      .orb-blue {
        width: 460px;
        height: 460px;
        right: -120px;
        top: -160px;
        background: rgba(79, 124, 255, 0.5);
      }
      .orb-soft {
        width: 380px;
        height: 380px;
        left: -140px;
        bottom: -180px;
        background: rgba(138, 168, 255, 0.3);
      }
      .content {
        position: relative;
        height: 100%;
        padding: 64px 72px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand-badge {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: linear-gradient(135deg, #4f7cff, #8aa8ff);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 26px;
        color: #07080c;
      }
      .brand-name {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.22em;
        color: #ffffff;
      }
      .spacer {
        flex: 1;
      }
      .hello {
        font-size: 22px;
        letter-spacing: 0.42em;
        color: #8aa8ff;
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      .name {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 104px;
        line-height: 1.02;
        letter-spacing: -0.02em;
        color: #ffffff;
        white-space: nowrap;
      }
      .role {
        margin-top: 18px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 20px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #ffffff;
        font-weight: 500;
      }
      .role .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: linear-gradient(135deg, #4f7cff, #8aa8ff);
      }
      .role span {
        color: #8aa8ff;
      }
      .tagline {
        margin-top: 22px;
        font-size: 21px;
        color: rgba(229, 231, 235, 0.6);
        letter-spacing: 0.02em;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 40px;
      }
      .footer-line {
        height: 2px;
        flex: 1;
        margin-right: 28px;
        background: linear-gradient(90deg, rgba(79, 124, 255, 0.8), transparent);
      }
      .footer-text {
        font-size: 16px;
        letter-spacing: 0.18em;
        color: rgba(229, 231, 235, 0.45);
        text-transform: uppercase;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="orb orb-blue"></div>
    <div class="orb orb-soft"></div>

    <div class="content">
      <div class="brand">
        <div class="brand-badge">S</div>
        <div class="brand-name">BUILT&nbsp;BY&nbsp;SANKALP</div>
      </div>

      <div class="spacer"></div>

      <div class="hello">Hello, I am</div>
      <div class="name">SANKALP&nbsp;PANDEY</div>
      <div class="role">
        Web Developer <span class="dot"></span> <span>AI &amp; Prompt Expert</span>
      </div>
      <div class="tagline">Crafting Your Digital Universe</div>

      <div class="footer">
        <div class="footer-line"></div>
        <div class="footer-text">sankalppandey.56@gmail.com</div>
      </div>
    </div>
  </body>
</html>
